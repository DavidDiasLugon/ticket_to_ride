name: Test project

on: [push, pull_request]

jobs:
  testAllModes:
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - scr
        testMode:
          - playmode
          - editmode
          - standalone
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}  
          fetch-depth: 0  
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-${{ hashFiles('**/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ matrix.projectPath }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+my.assembly.*'
      - name: Verify artifacts exist
        run: |
          echo "Artifacts path: ${{ steps.tests.outputs.artifactsPath }}"
          ls -la ${{ steps.tests.outputs.artifactsPath }} || echo "Artifacts not found"
          echo "Coverage path: ${{ steps.tests.outputs.coveragePath }}"
          ls -la ${{ steps.tests.outputs.coveragePath }} || echo "Coverage not found"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ matrix.testMode }}-${{ github.run_id }}
          path: ${{ steps.tests.outputs.artifactsPath }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage-${{ matrix.testMode }}-${{ github.run_id }}
          path: ${{ steps.tests.outputs.coveragePath }}
